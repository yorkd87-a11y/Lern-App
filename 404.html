<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="0;url=https://team-lernapp-york-test.web.app/">
  <link rel="canonical" href="https://team-lernapp-york-test.web.app/">
  <title>SalonVorsprung wird geöffnet</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #fff7df; background: radial-gradient(circle at 50% 20%, #24365f 0, #0c1428 38%, #060912 100%); }
    main { width: min(520px, 100%); text-align: center; }
    .mark { width: 88px; height: 88px; margin: 0 auto 22px; display: grid; place-items: center; border: 1px solid #e9bd58; border-radius: 28px; color: #f6d681; font: 700 32px/1 Georgia, serif; box-shadow: 0 18px 50px #0008, inset 0 0 30px #e9bd5815; }
    .kicker { margin: 0 0 10px; color: #e9bd58; font-size: 13px; font-weight: 800; letter-spacing: .2em; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 7vw, 48px); line-height: 1.05; }
    p { margin: 0 auto 28px; max-width: 420px; color: #c8c5bd; font-size: 17px; line-height: 1.55; }
    a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 22px; border-radius: 14px; color: #15100a; background: linear-gradient(135deg, #f8d77e, #d99b2b); font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">SV</div>
    <p class="kicker">SALONVORSPRUNG</p>
    <h1>Die App ist umgezogen.</h1>
    <p>Du wirst automatisch zur aktuellen, sicheren Web-App weitergeleitet.</p>
    <a href="https://team-lernapp-york-test.web.app/">SalonVorsprung öffnen</a>
  </main>
  <script>window.location.replace("https://team-lernapp-york-test.web.app/");</script>
</body>
</html>
